# ============================================================
# ClassHack Application Configuration
# ============================================================
spring.application.name=ClassHack
server.port=8080

# ------------------------------------------------------------
# MySQL 8 Database Configuration
# Supports environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
# ------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true


# ------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------
logging.level.com.classhack=INFO
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------
# Application Base URL
# Supports environment variable: APP_BASE_URL (defaults to http://localhost:8080)
# ------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ------------------------------------------------------------
# Resend Email API Configuration (HTTPS)
# Supports environment variables: RESEND_API_KEY, MAIL_FROM
# ------------------------------------------------------------
app.mail.resend-api-url=${RESEND_API_URL:https://api.resend.com/emails}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:ClassHack <onboarding@resend.dev>}
mail.from=${MAIL_FROM:ClassHack <onboarding@resend.dev>}

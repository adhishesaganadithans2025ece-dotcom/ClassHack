# ============================================================
# ClassHack Application Configuration
# ============================================================
spring.application.name=ClassHack
server.port=8080

# ------------------------------------------------------------
# MySQL 8 Database Configuration
# Supports environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
# ------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true


# ------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------
logging.level.com.classhack=INFO
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------
# Application Base URL
# Supports environment variable: APP_BASE_URL (defaults to http://localhost:8080)
# ------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ------------------------------------------------------------
# Spring Boot Mail Configuration (SMTP)
# Supports environment variables: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:ClassHack <no-reply@classhack.com>}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Access Denied | ClassHack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="text-center p-4" style="max-width: 500px;">
    <div class="mb-3 text-danger">
        <i class="bi bi-shield-x" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">403 — Access Denied</h1>
    <p class="text-muted mb-4">
        You do not have permission to view or manipulate this resource. Student accounts cannot access administrative portals or data of other students.
    </p>
    <div class="d-flex gap-2 justify-content-center">
        <a href="/" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house-door-fill me-1"></i> Return to Safety / Login
        </a>
    </div>
</div>

</body>
</html>

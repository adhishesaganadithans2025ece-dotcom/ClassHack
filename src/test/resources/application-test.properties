spring.application.name=ClassHackTest
spring.datasource.url=jdbc:h2:mem:classhack_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.base-url=http://localhost:8080
app.mail.resend-api-url=https://api.resend.com/emails
app.mail.resend-api-key=test_api_key
app.mail.from=ClassHack <onboarding@resend.dev>
mail.from=ClassHack <onboarding@resend.dev>
